# Configuration Keepalived - Serveur Principal (mail1)
# Nœud : 192.168.1.10 | IP Flottante : 192.168.1.100

vrrp_script chk_mail_services {
    script "/usr/local/bin/check_mail_health.sh"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_MAIL {
    state BACKUP              # Mode BACKUP sur les deux nœuds combiné avec nopreempt
    interface eth0
    virtual_router_id 51
    priority 100              # Priorité supérieure pour le nœud principal
    nopreempt                 # Empêche la reprise automatique intempestive (anti-flapping)
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CEM_VRRP_2024_PASS
    }

    virtual_ipaddress {
        192.168.1.100/24 dev eth0
    }

    track_script {
        chk_mail_services
    }

    notify_master "/usr/bin/logger -t keepalived 'mail1 a pris le statut MASTER (IP 192.168.1.100 active)'"
    notify_backup "/usr/bin/logger -t keepalived 'mail1 a basculé en statut BACKUP'"
    notify_fault  "/usr/bin/logger -t keepalived 'mail1 est en FAULT suite à incident de service'"
}
